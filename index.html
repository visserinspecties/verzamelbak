<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Verzamelbak</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Verzamelbak">
<meta name="theme-color" content="#f4efe6">
<style>
  :root {
    --bg: #f4efe6;
    --ink: #2b2620;
    --ink-soft: #8a8174;
    --card: #fffdf8;
    --accent: #b5482a;
    --line: #ddd4c4;
    --word-l: 36%;   /* helderheid van de woordkleuren */
    --hl: rgba(255, 230, 0, .8);    /* markeerstift */
    --hl-ico: #9a7600;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --word-l: 68%;
      --hl: rgba(204, 168, 20, .5);
      --hl-ico: #e6c230;
      --bg: #1d1b18;
      --ink: #efe8da;
      --ink-soft: #8d8576;
      --card: #292622;
      --accent: #e0714f;
      --line: #3b372f;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); }
  body {
    font-family: Merriweather, Georgia, "Times New Roman", serif;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    overflow-x: hidden;
  }

  /* De wolk */
  #cloud {
    min-height: 100vh;
    max-width: 640px;          /* smal genoeg om over meerdere regels te vallen */
    margin: 0 auto;
    padding: calc(10vh + 60px) 20px 160px;   /* boven: ruimte voor de categoriebalk */
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-content: center;
    align-items: center;
  }
  .word {
    background: none;
    border: 0;
    font: inherit;
    color: hsl(var(--hue, 20), 58%, var(--word-l));
    padding: 2px 4px;
    line-height: 1.15;
    cursor: pointer;
    max-width: 100%;
    overflow-wrap: anywhere;
    transition: transform .2s ease;
  }
  .word:active { transform: scale(.96) !important; }
  .w1 { font-size: 15px; opacity: .6; }
  .w2 { font-size: 20px; opacity: .78; }
  .w3 { font-size: 27px; opacity: .92; }
  .w4 { font-size: 36px; font-weight: 700; }
  .w5 { font-size: 46px; font-weight: 700; }

  /* Deadline: heel klein onder het woord */
  .word .lbl { display: block; }
  .word .due {
    display: block;
    font-size: 10px;
    font-weight: 400;
    line-height: 1.2;
    margin-top: 1px;
    color: var(--ink-soft);
    opacity: .9;
  }
  .word .due.now { color: var(--accent); }
  /* Deadline is vandaag (of voorbij) en nog niet bekeken: datum knippert langzaam */
  .word .due.blink { font-weight: 700; animation: dueBlink 2.4s ease-in-out infinite; }
  @keyframes dueBlink { 0%, 100% { opacity: 1; } 50% { opacity: .12; } }

  /* Markeerstift: slordige gele streep achter het woord. Alles in em, dus hij groeit en krimpt mee met het woord. */
  .word { position: relative; isolation: isolate; }
  .word.hl .lbl { position: relative; }
  .word.hl .lbl::before {
    content: '';
    position: absolute; z-index: -1;
    left: -.28em; right: -.28em; top: .06em; bottom: -.04em;
    background: var(--hl);
    transform: rotate(var(--hr, 0deg));
    clip-path: polygon(
      0 var(--t1), 34% var(--t2), 68% var(--t3), 100% var(--t4),
      100% var(--b4), 66% var(--b3), 31% var(--b2), 0 var(--b1));
  }
  .ico.on { opacity: 1; color: var(--hl-ico); }

  /* Iconen in het item-venster: klein en rustig, maar met een groot tikvlak */
  dialog { position: fixed; }
  .icons { position: absolute; top: 6px; right: 6px; display: flex; }
  .ico {
    position: relative;
    width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    background: none; border: 0; padding: 0;
    color: var(--ink-soft); opacity: .6; cursor: pointer;
  }
  .ico svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
  /* Het datumveld ligt onzichtbaar over het icoon: tikken opent direct de datumkiezer van de telefoon */
  .ico input[type=date] {
    position: absolute; inset: 0; width: 100%; height: 100%;
    opacity: 0; border: 0; padding: 0; margin: 0; font-size: 16px; cursor: pointer;
    /* iPhone/Safari geeft een datumveld anders een eigen minimale breedte, waardoor het tikvlak
       rechts naast het icoon kwam te liggen. Zonder eigen opmaak volgt het precies het icoon. */
    -webkit-appearance: none; appearance: none; min-width: 0; max-width: 100%;
    box-sizing: border-box; display: block; background: transparent; color: transparent;
  }
  .ico input[type=date]::-webkit-date-and-time-value { text-align: left; }
  #itemDlg { position: fixed; padding-top: 28px; }
  .dueline { display: flex; align-items: center; gap: 6px; margin-top: 10px; font-size: 13px; color: var(--ink-soft); min-height: 24px; }
  .dueline.now { color: var(--accent); }
  .dueline button { font: inherit; font-size: 12px; color: var(--ink-soft); background: none; border: 0; padding: 10px; margin: -10px 0; cursor: pointer; text-decoration: underline; }
  .dueline button.aan { color: var(--accent); }
  .addrow { display: flex; align-items: center; margin-top: 4px; }
  .addrow .ico { width: 44px; height: 44px; margin-left: -10px; }
  #editText { margin-top: 2px; }

  .empty {
    color: var(--ink-soft);
    text-align: center;
    font-style: italic;
    padding: 0 30px;
  }

  /* Plusje */
  #add {
    position: fixed;
    left: 50%;
    bottom: calc(28px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    width: 64px; height: 64px;
    border-radius: 50%;
    border: 0;
    background: var(--accent);
    color: #fff;
    font-size: 36px;
    line-height: 1;
    box-shadow: 0 6px 18px rgba(0,0,0,.25);
    cursor: pointer;
  }

  /* Archiefknopje: bewust onopvallend */
  /* Tekst blijft klein; het tikvlak is minstens 56 x 56 px (grote vingers, kleine telefoon) */
  #archiveBtn {
    position: fixed;
    right: 0;
    bottom: env(safe-area-inset-bottom);
    min-width: 56px; min-height: 56px;
    display: flex; align-items: center; justify-content: flex-end;
    background: none;
    border: 0;
    font: inherit;
    font-size: 12px;
    color: var(--ink-soft);
    opacity: .5;
    padding: 0 18px;
    cursor: pointer;
  }

  /* Sync-status: ook onopvallend, links onderin */
  #syncBtn {
    position: fixed;
    left: 0;
    bottom: env(safe-area-inset-bottom);
    min-width: 56px; min-height: 56px;
    display: flex; align-items: center; justify-content: flex-start;
    background: none;
    border: 0;
    font: inherit;
    font-size: 12px;
    color: var(--ink-soft);
    opacity: .5;
    padding: 0 18px;
    cursor: pointer;
  }
  #syncBtn.err { color: var(--accent); opacity: .95; }

  /* Aantal actief: alleen informatie, rechtsboven, net zo klein als archief en sync */
  #activeCount {
    position: fixed;
    right: 0;
    top: env(safe-area-inset-top);
    min-height: 56px;
    display: flex; align-items: center;
    font-size: 12px;
    color: var(--ink-soft);
    opacity: .5;
    padding: 0 18px;
    pointer-events: none;   /* tikken gaat er dwars doorheen */
  }

  /* Zoeken: klein vergrootglas linksboven, net zo rustig als de andere hoekjes */
  #searchBtn {
    position: fixed;
    left: 0;
    top: env(safe-area-inset-top);
    min-width: 56px; min-height: 56px;
    display: flex; align-items: center; justify-content: flex-start;
    background: none; border: 0;
    padding: 0 18px;
    color: var(--ink-soft);
    opacity: .5;
    cursor: pointer;
    z-index: 5;
  }
  #searchBtn svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; pointer-events: none; }
  #searchBtn.on { opacity: 1; color: var(--accent); }
  #searchBar {
    position: fixed;
    left: 56px; right: 96px;
    top: env(safe-area-inset-top);
    height: 56px;
    display: none; align-items: center;
    z-index: 5;
  }
  #searchBar.open { display: flex; }
  #searchInput {
    flex: 1; min-width: 0;
    font: inherit;
    font-size: 16px;            /* voorkomt inzoomen op iPhone */
    color: var(--ink);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 7px 34px 7px 12px;
    -webkit-appearance: none; appearance: none;
  }
  #searchInput:focus { outline: none; border-color: var(--ink-soft); }
  #searchInput::-webkit-search-cancel-button { display: none; }
  #searchClear {
    position: absolute; right: 0; top: 6px;
    width: 44px; height: 44px;
    background: none; border: 0; padding: 0;
    font-size: 20px; line-height: 1;
    color: var(--ink-soft); cursor: pointer;
  }
  #archHits {
    display: block;
    margin: 18px auto 0;
    flex-basis: 100%;
    font: inherit; font-size: 13px;
    color: var(--ink-soft);
    background: none; border: 0;
    padding: 12px; cursor: pointer;
    text-decoration: underline;
  }

  /* Categorieën: vier icoontjes bovenin het midden. Uit = grijs en rustig, aan = in kleur. */
  #catBar {
    position: fixed;
    left: 50%; transform: translateX(-50%);
    top: env(safe-area-inset-top);
    height: 56px;
    display: flex; align-items: center; gap: 6px;
    padding: 0 6px;
    background: var(--bg);
    border-radius: 0 0 22px 22px;
    z-index: 4;
  }
  #catBar.verborgen { display: none; }
  .catBtn {
    width: 50px; height: 56px;            /* groot tikvlak voor de iPhone */
    display: flex; align-items: center; justify-content: center;
    background: none; border: 0; padding: 0; cursor: pointer;
    font-size: 23px; line-height: 1;
    filter: grayscale(1); opacity: .45;
    position: relative;
  }
  .catBtn.on { filter: none; opacity: 1; }
  .catBtn.on::after {
    content: ''; position: absolute; bottom: 9px; left: 50%;
    width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%;
    background: var(--accent);
  }
  #catInfo {
    position: fixed;
    left: 50%; transform: translateX(-50%);
    top: calc(env(safe-area-inset-top) + 52px);
    display: none;
    font: inherit; font-size: 12px;
    color: var(--accent);
    background: none; border: 0;
    padding: 8px 12px;
    white-space: nowrap;
    cursor: pointer;
    z-index: 4;
  }
  #catInfo.open { display: block; }
  /* In het item-venster: bij welke categorie hoort dit */
  .catline { display: flex; align-items: center; gap: 2px; margin-top: 10px; font-size: 12px; color: var(--ink-soft); flex-wrap: wrap; }
  .catline { gap: 6px; }
  .catline .catBtn { width: 48px; height: 48px; font-size: 22px; }
  .catline .catBtn.on::after { bottom: 4px; }
  .catline .auto { font: inherit; font-size: 12px; color: var(--ink-soft); background: none; border: 0; padding: 10px 6px; cursor: pointer; text-decoration: underline; }
  .catline .autotxt { padding: 0 6px; }
  /* telefoonnummer in de tekst: tik = bellen */
  .bigtext a.tel { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
  /* WhatsApp-knopje achter een mobiel nummer: klein icoon, groot tikvlak */
  .bigtext a.wa {
    display: inline-flex; align-items: center; justify-content: center;
    width: 40px; height: 32px; margin: -6px -4px -6px 2px; vertical-align: middle;
  }
  .bigtext a.wa svg { width: 22px; height: 22px; fill: #25a244; }
  .bigtext a.wa svg .tl { fill: #fff; }
  /* Voorstel met gevonden contactgegevens: klopt dit? ✓ / ✗ */
  #itemSuggest { margin-top: 12px; font-size: 13px; color: var(--ink-soft); }
  #itemSuggest:empty { display: none; }
  #itemSuggest .kop { margin: 0 0 4px; }
  #itemSuggest .kand {
    display: flex; align-items: center; gap: 4px;
    border: 1px dashed var(--line); border-radius: 12px;
    padding: 6px 4px 6px 12px; margin-top: 6px; color: var(--ink);
  }
  #itemSuggest .kand .gegevens { flex: 1; min-width: 0; overflow-wrap: anywhere; line-height: 1.4; }
  #itemSuggest .kand .bron { display: block; font-size: 11px; color: var(--ink-soft); }
  #itemSuggest .kand button {
    width: 44px; height: 44px; flex: none;
    font-size: 20px; background: none; border: 0; cursor: pointer; color: var(--ink-soft);
  }
  #itemSuggest .kand button.ja { color: #2e7d32; }
  #itemSuggest .link { font: inherit; font-size: 12px; color: var(--ink-soft); background: none; border: 0; padding: 8px 0; cursor: pointer; text-decoration: underline; }

  /* Vensters */
  dialog {
    border: 0;
    border-radius: 18px;
    background: var(--card);
    color: var(--ink);
    width: min(92vw, 520px);
    padding: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,.35);
    font-family: inherit;
  }
  dialog::backdrop { background: rgba(0,0,0,.4); }
  dialog h2 { margin: 0 0 12px; font-size: 16px; }
  textarea {
    width: 100%;
    min-height: 110px;
    font: inherit;
    font-size: 16px; /* voorkomt inzoomen op iPhone */
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px;
    resize: none;
  }
  .row { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .btn {
    flex: 1;
    min-width: 90px;
    font: inherit;
    font-size: 14px;
    padding: 12px 10px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--ink);
    cursor: pointer;
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.quiet { color: var(--ink-soft); }
  .bigtext { font-size: 18px; line-height: 1.45; margin: 0 0 4px; white-space: pre-wrap; overflow-wrap: anywhere; }
  /* afvinken per regel: tik op een regel en hij wordt doorgestreept */
  .bigtext .ln { display: block; cursor: pointer; border-radius: 6px; margin: 0 -4px; padding: 0 4px; -webkit-tap-highlight-color: transparent; }
  .bigtext .ln:hover { background: rgba(128,128,128,.10); }
  .bigtext .ln.empty { cursor: default; background: none; }
  .ln.done { text-decoration: line-through; opacity: .5; }
  #archiveList .ln { display: block; }
  .meta { font-size: 12px; color: var(--ink-soft); margin: 0; }

  /* Archief */
  #archiveList { list-style: none; margin: 0; padding: 0; max-height: 60vh; overflow: auto; }
  #archiveList li {
    display: flex; gap: 10px; align-items: center;
    padding: 10px 0; border-bottom: 1px solid var(--line);
  }
  #archiveList li span { flex: 1; font-size: 14px; overflow-wrap: anywhere; }
  #archiveList .archdate { display: block; font-size: 11px; color: var(--muted, #8e8e93); margin-top: 2px; }
  #archiveList button {
    font: inherit; font-size: 12px; color: var(--accent);
    background: none; border: 0; padding: 6px; cursor: pointer;
  }
</style>
</head>
<body>

<main id="cloud" aria-live="polite"></main>

<button id="add" aria-label="Iets in de emmer gooien">+</button>
<button id="archiveBtn">archief</button>
<button id="syncBtn">inloggen</button>
<div id="activeCount" aria-live="polite"></div>
<button id="searchBtn" aria-label="Zoeken">
  <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg>
</button>
<div id="catBar" role="toolbar" aria-label="Filter op categorie"></div>
<button id="catInfo" type="button"></button>
<div id="searchBar">
  <input type="search" id="searchInput" placeholder="Zoek in de emmer…" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search" aria-label="Zoeken">
  <button id="searchClear" aria-label="Zoeken sluiten">×</button>
</div>

<!-- Nieuw item -->
<dialog id="addDlg">
  <h2>Wat gaat de emmer in?</h2>
  <textarea id="addText" placeholder="Taak, belofte of idee… (de eerste regel is het onderwerp; in de wolk zie je maximaal twee woorden)"></textarea>
  <div class="addrow">
    <span class="ico" aria-label="Deadline kiezen">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      <input type="date" id="addDue" aria-label="Deadline">
    </span>
    <span class="meta" id="addDueTxt"></span>
  </div>
  <div class="row">
    <button class="btn quiet" id="addCancel">Annuleer</button>
    <button class="btn primary" id="addSave">Erin</button>
  </div>
</dialog>

<!-- Item bekijken / aanpassen -->
<dialog id="itemDlg">
  <div class="icons" id="itemIcons">
    <button class="ico" id="itemHl" aria-label="Markeren">
      <svg viewBox="0 0 24 24"><path d="M14.5 4l5.5 5.5-8.5 8.5-5.5-5.5z"/><path d="M6 12.5L4.5 18l5.5-1.5"/><path d="M13 21h8"/></svg>
    </button>
    <button class="ico" id="itemEdit" aria-label="Bewerken">
      <svg viewBox="0 0 24 24"><path d="M4 20l1-4L16.5 4.5a2 2 0 0 1 3 0l0 0a2 2 0 0 1 0 3L8 19z"/><path d="M14.5 6.5l3 3"/></svg>
    </button>
    <span class="ico" aria-label="Deadline kiezen">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      <input type="date" id="itemDue" aria-label="Deadline">
    </span>
  </div>
  <p class="bigtext" id="itemText"></p>
  <textarea id="editText" style="display:none"></textarea>
  <p class="meta" id="itemMeta"></p>
  <div class="catline" id="itemCats"></div>
  <div id="itemSuggest" aria-live="polite"></div>
  <p class="meta"><a id="itemLink" target="_blank" rel="noopener" style="display:none;color:inherit"></a></p>
  <div class="dueline" id="itemDueLine" style="display:none"><span id="itemDueTxt"></span><button id="itemDueClear" type="button">wis</button><button id="itemDueBlink" type="button" style="display:none">knipper weer</button></div>
  <div id="viewRows">
    <div class="row">
      <button class="btn" id="itemUp">Belangrijker</button>
      <button class="btn" id="itemDown">Minder belangrijk</button>
    </div>
    <div class="row">
      <button class="btn quiet" id="itemDone">Opgepakt / weg ermee</button>
    </div>
    <div class="row">
      <button class="btn primary" id="itemClose">Sluit</button>
    </div>
  </div>
  <div class="row" id="editRows" style="display:none">
    <button class="btn quiet" id="editCancel">Annuleer</button>
    <button class="btn primary" id="editSave">Bewaar</button>
  </div>
</dialog>

<!-- Archief -->
<dialog id="archDlg">
  <h2>Archief</h2>
  <p class="meta" id="archFilter" style="display:none;margin:-6px 0 8px"></p>
  <ul id="archiveList"></ul>
  <p class="meta" id="archEmpty">Niets in het archief.</p>
  <div class="row">
    <button class="btn quiet" id="archClose">Sluit</button>
  </div>
</dialog>

<!-- Synchronisatie -->
<dialog id="syncDlg">
  <h2>Synchronisatie met OneDrive</h2>
  <p class="bigtext" id="syncInfo"></p>
  <p class="meta" id="syncErr"></p>
  <div class="row">
    <button class="btn primary" id="syncNow">Nu synchroniseren</button>
    <button class="btn" id="syncOut">Uitloggen</button>
  </div>
  <div class="row">
    <button class="btn quiet" id="syncClose">Sluit</button>
  </div>
</dialog>

<script>
(function () {
  'use strict';
  var KEY = 'verzamelbak.v1';
  var items = load();

  function load() {
    var list = [];
    try {
      var raw = localStorage.getItem(KEY);
      list = raw ? JSON.parse(raw) : [];
    } catch (e) { list = []; }
    // Oudere items kregen nog geen wijzigingstijd; die vullen we aan.
    list.forEach(function (it) { if (!it.updated) it.updated = it.archivedAt || it.created || 0; });
    return list;
  }
  // Alleen lokaal bewaren (gebruikt na een sync, om geen nieuwe sync uit te lokken)
  function persist() {
    try { localStorage.setItem(KEY, JSON.stringify(items)); } catch (e) {}
  }
  // Lokale wijziging: bewaren en laten synchroniseren
  function save() {
    persist();
    scheduleSync();
  }
  function touch(it) { it.updated = Date.now(); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  // Vaste "willekeur" per item, zodat de wolk niet bij elke render verspringt.
  // Goede menging: items die vlak na elkaar zijn toegevoegd krijgen toch heel andere waarden.
  function hash(s) {
    var h = 2166136261;
    for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    h ^= h >>> 13; h = Math.imul(h, 0x85ebca6b);
    h ^= h >>> 16; h = Math.imul(h, 0xc2b2ae35);
    h ^= h >>> 16;
    return h >>> 0;
  }
  // Onafhankelijke waarde tussen 0 en 1 per item en per eigenschap
  function rnd(id, k) { return hash(id + ':' + k) / 4294967296; }

  // Kleuren: een vaste set tinten, zodat het kleurrijk maar rustig blijft
  var HUES = [12, 28, 42, 95, 150, 180, 205, 230, 265, 300, 335];

  var $ = function (id) { return document.getElementById(id); };
  var cloud = $('cloud');

  // Onderwerp in de wolk: maximaal twee woorden.
  // Staat er een eerste regel, dan geldt die als onderwerp; anders de eerste twee woorden.
  function shortLabel(text) {
    var first = text.trim().split(/\n/)[0].trim().replace(/^✓ /, '');
    var words = first.split(/\s+/).filter(Boolean);
    var label = words.slice(0, 2).join(' ');
    return label.length > 28 ? label.slice(0, 26) + '…' : label;
  }

  // Deadline ('JJJJ-MM-DD') netjes tonen, bv. "24 okt". Geeft ook aan of het vandaag of al voorbij is.
  function parseDue(s) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || '');
    return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
  }
  function dueInfo(s) {
    var d = parseDue(s); if (!d) return null;
    var t = new Date(); t.setHours(0, 0, 0, 0);
    var opts = { day: 'numeric', month: 'short' };
    if (d.getFullYear() !== t.getFullYear()) opts.year = 'numeric';
    return { text: d.toLocaleDateString('nl-NL', opts).replace('.', ''), now: d <= t };
  }
  // Lijst "EPA projecten": tel de open projectregels (regel met een postcode, niet afgevinkt).
  // Telt live mee: vink je een regel af, dan zakt het getal in de wolk meteen.
  function openCount(it) {
    var lines = String(it.text || '').split('\n');
    if (!/^epa projecten\b/i.test(lines[0].trim())) return null;
    return lines.slice(1).filter(function (l) {
      return l.indexOf('✓ ') !== 0 && /\b\d{4} ?[A-Z]{2}\b/.test(l);
    }).length;
  }
  // Knipperen: deadline is vandaag of voorbij, en het item is sinds die deadline nog niet geopend.
  // it.dueSeen bewaart de deadline waarbij je hem bekeken hebt; een nieuwe datum knippert dus weer.
  function blinks(it) {
    var di = dueInfo(it.due);
    return !!(di && di.now && it.dueSeen !== it.due);
  }

  /* ---------- zoeken ----------
     Zoekt in de hele tekst (niet alleen de twee woorden in de wolk), zonder op hoofdletters
     of accenten te letten. Meerdere woorden: alle woorden moeten erin voorkomen. */
  var query = '';
  function norm(s) {
    return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/✓ /g, '');
  }
  function matches(it) {
    var q = norm(query).trim();
    if (!q) return true;
    var hay = norm(it.text + ' ' + (dueInfo(it.due) || {}).text);
    return q.split(/\s+/).every(function (w) { return hay.indexOf(w) > -1; });
  }

  /* ---------- categorieën ----------
     Vier categorieën. Een item kan er meer hebben: "Mensen" is een actie (bellen, mailen,
     afspreken), de andere drie zijn onderwerpen. "Reimer bellen over Heilleweg" = Werk + Mensen.
     Automatisch op trefwoorden; tik je ze zelf aan in het item, dan geldt jouw keuze (it.cats). */
  var CATS = [
    { id: 'werk',   ico: '📐', naam: 'Werk' },
    { id: 'geld',   ico: '💶', naam: 'Geld' },
    { id: 'mensen', ico: '📞', naam: 'Mensen' },
    { id: 'prive',  ico: '🏠', naam: 'Privé' }
  ];
  function catNaam(id) { return CATS.filter(function (c) { return c.id === id; })[0] || {}; }
  var RE_POSTCODE = /\b\d{4} ?[A-Z]{2}\b/;
  var RE_ADRES = /\b[a-z]+(straat|weg|dijk|laan|plein|gracht|kade|singel|hof|daal|boulevard|plaats)\s+\d/;
  var RE_WERK = /\b(epa|label|labels|afmeting\w*|dossier\w*|opname|project\w*|vabi|huismaten|isolatie|installatie\w*|maatwerk\w*|meting|co2|mappen|map|foto\w*|bluebeam|bleubeam|cloudflare|tool|tools|aantekeningen|pand|appartement|woning|ep-?online|ep-?sys|bcrg|nta|brl|keuring|rapport\w*|tekening\w*)\b/;
  var RE_GELD = /\b(btw|rekening\w*|factu\w*|belasting\w*|boete\w*|flynth|abbo|abonnement\w*|betal\w*|incasso|aanslag|declar\w*|verzekering\w*|bank|kosten|bv|creditnota|digidentity|aangifte)\b/;
  var RE_MENSEN = /\b(bel|bellen|gebeld|terugbellen|mail|mailen|mailtje|spreken|whatsapp|appen|appje|contact|overleg|overleggen|bespreken|terugkoppelen)\b/;
  var RE_MENSEN_ZWAK = /\b(afspraak|afspreken|langs)\b/;   // telt niet bij een eigen privé-afspraak (fysio, lens)
  var RE_PRIVE = /\b(apotheek|fysio\w*|dokter|doktonline|huisarts|tandarts|griepprik|lens|ikea|batterij\w*|garen|naaigaren|auto|beurt|apk|boodschap\w*|saga|boot|verjaardag|bier|eten|diner|kapper|sport|gym)\b/;

  function autoCats(it) {
    var t = String(it.text || ''), n = norm(t), eerste = t.trim().split('\n')[0].replace(/^✓ /, '').trim();
    if (/^epa (projecten|afgewerkt)\b/i.test(eerste)) return ['werk'];      // vaste lijsten
    var c = {};
    if (RE_POSTCODE.test(t) || RE_ADRES.test(n) || RE_WERK.test(n)) c.werk = true;
    if (RE_GELD.test(n)) c.geld = true;
    if (RE_PRIVE.test(n)) c.prive = true;
    if (RE_MENSEN.test(n) || RE_MAILADRES.test(t) || t.match(RE_TEL)) c.mensen = true;
    if (!c.prive && RE_MENSEN_ZWAK.test(n)) c.mensen = true;

    if (!Object.keys(c).length) {

    }

  function catsVan(it) { return Array.isArray(it.cats) ? it.cats : autoCats(it); }

  // Filter: alleen in het geheugen. Na herladen, of na een tijd weg uit de app, staat alles weer aan.

    var active = allActive.filter(matches).filter(inFilter);
    tekenCatBar();
    cloud.innerHTML = '';

    if (!active.length) {
      var p = document.createElement('p');

      p.textContent = query.trim() ? 'Niets gevonden in de wolk.'

      // Mengvolgorde is stabiel (op hash), zodat het amorf oogt maar niet verspringt
      active.slice().sort(function (a, b) { return hash(a.id) - hash(b.id); })
        .forEach(function (item) {
          var id = item.id;
          var b = document.createElement('button');
          b.className = 'word w' + item.w;
          var lbl = document.createElement('span');
          lbl.className = 'lbl';
          lbl.textContent = shortLabel(item.text);
          if (item.hl) {
            // Per item een eigen, vaste "slordige" vorm

            var pc = function (k, lo, hi) { return (lo + rnd(id, k) * (hi - lo)).toFixed(0) + '%'; };
            lbl.style.setProperty('--t1', pc('t1', 0, 16)); lbl.style.setProperty('--t2', pc('t2', 0, 16));
            lbl.style.setProperty('--t3', pc('t3', 0, 16)); lbl.style.setProperty('--t4', pc('t4', 0, 16));
            lbl.style.setProperty('--b1', pc('b1', 84, 100)); lbl.style.setProperty('--b2', pc('b2', 84, 100));
            lbl.style.setProperty('--b3', pc('b3', 84, 100)); lbl.style.setProperty('--b4', pc('b4', 84, 100));
            lbl.style.setProperty('--hr', ((rnd(id, 'hr') - 0.5) * 3).toFixed(1) + 'deg');
          }
          b.appendChild(lbl);
          var di = dueInfo(item.due), oc = openCount(item);

            ds.textContent = [di ? di.text : '', oc !== null ? oc + ' open' : ''].filter(Boolean).join(' · ');
            b.appendChild(ds);

          // Kleur
          b.style.setProperty('--hue', HUES[Math.floor(rnd(id, 'hue') * HUES.length)]);

          // Schuinte: wisselend links en rechts, soms vrijwel recht
          var rot = (rnd(id, 'rot') - 0.5) * 2 * 13;       // -13 .. +13 graden

          // Ruimte rondom, per woord anders
          var my = 2 + rnd(id, 'my') * 26;                  // 2 .. 28 px boven en onder
          var mx = 4 + rnd(id, 'mx') * 22;                  // 4 .. 26 px links en rechts

          b.style.margin = my.toFixed(0) + 'px ' + mx.toFixed(0) + 'px';
          b.style.transform = 'translate(' + dx.toFixed(0) + 'px,' + dy.toFixed(0) + 'px) rotate(' + rot.toFixed(1) + 'deg)';
          b.addEventListener('click', function () { openItem(id); });
          cloud.appendChild(b);
        });
    }
    var n = items.length - allActive.length;
    $('archiveBtn').textContent = n ? 'archief (' + n + ')' : 'archief';
    if (query.trim()) {
      $('activeCount').textContent = active.length + ' van ' + allActive.length;
      // Ook treffers in het archief? Dan een linkje eronder.
      var ah = items.filter(function (i) { return i.archived && matches(i); }).length;
      if (ah) {
        var a = document.createElement('button');
        a.id = 'archHits';
        a.textContent = ah === 1 ? 'ook 1 in het archief' : 'ook ' + ah + ' in het archief';
        a.addEventListener('click', function () { renderArchive(); archDlg.showModal(); });
        cloud.appendChild(a);
      }
    } else if (filterCat) {
      $('activeCount').textContent = active.length + ' van ' + allActive.length;
    } else {
      $('activeCount').textContent = 'actief (' + allActive.length + ')';
    }
  }

  var searchBtn = $('searchBtn'), searchBar = $('searchBar'), searchInput = $('searchInput');
  // Zoeken kijkt altijd in de hele emmer: het categoriefilter gaat uit en de balk maakt plaats.
  function openSearch() {
    filterCat = null;
    searchBar.classList.add('open'); searchBtn.classList.add('on');
    $('catBar').classList.add('verborgen');

    query = ''; searchInput.value = '';

  searchInput.addEventListener('input', function () { query = searchInput.value; render(); });
  searchInput.addEventListener('keydown', function (e) {

  $('searchClear').addEventListener('click', closeSearch);

  // Nieuw item
  var addDlg = $('addDlg'), addText = $('addText');
  var addDue = $('addDue');
  function showAddDue() {
    var di = dueInfo(addDue.value);
    $('addDueTxt').textContent = di ? 'Deadline ' + di.text : '';
  }
  addDue.addEventListener('change', showAddDue);
  $('add').addEventListener('click', function () {
    addText.value = '';
    addDue.value = ''; showAddDue();
    addDlg.showModal();
    setTimeout(function () { addText.focus(); }, 50);
  });
  $('addCancel').addEventListener('click', function () { addDlg.close(); });
  function addSave() {
    var t = addText.value.trim();
    if (!t) { addDlg.close(); return; }
    var now = Date.now();
    var nieuw = { id: uid(), text: t, w: 3, created: now, updated: now, archived: false };
    if (parseDue(addDue.value)) nieuw.due = addDue.value;
    items.push(nieuw);
    save(); render(); addDlg.close();
  }
  $('addSave').addEventListener('click', addSave);
  addText.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { addSave(); }
  });

  // Item bekijken
  var itemDlg = $('itemDlg'), currentId = null;
  function find(id) { return items.filter(function (i) { return i.id === id; })[0]; }
  function openItem(id) {
    var it = find(id); if (!it) return;
    currentId = id;
    // Geopend = gezien: de datum hoeft niet meer te knipperen
    if (blinks(it)) { it.dueSeen = it.due; touch(it); save(); render(); }
    setEditMode(false);
    showItem(it);
    itemDlg.showModal();
  }
  // Een afgevinkte regel begint met "✓ "; zo blijft het gewone tekst en synchroniseert het gewoon mee.
  var DONE = '✓ ';
  function isDone(l) { return l.indexOf(DONE) === 0; }
  function fillLines(el, text, clickable) {
    el.innerHTML = '';
    text.split('\n').forEach(function (l, i) {
      var s = document.createElement('span');
      s.className = 'ln';
      if (!l.trim()) { s.className += ' empty'; s.textContent = '\u200b'; }
      else {
        var zicht = isDone(l) ? l.slice(DONE.length) : l;
        if (isDone(l)) s.className += ' done';
        if (clickable) zetMetTelLinks(s, zicht); else s.textContent = zicht;
        if (clickable) { s.setAttribute('data-i', i); s.title = isDone(l) ? 'Tik om terug te zetten' : 'Tik om af te vinken'; }

  // Telefoonnummers in de tekst worden een bel-link (tik = bellen, niet afvinken)

      if (m.index > pos) el.appendChild(document.createTextNode(tekst.slice(pos, m.index)));

        w.setAttribute('aria-label', 'WhatsApp naar ' + m[0]); w.title = 'WhatsApp';
        w.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2a8.6 8.6 0 0 0-7.4 13l-1.2 4.4 4.5-1.2A8.6 8.6 0 1 0 12 3.2z"/><path class="tl" d="M8.9 8.2c.3-.3.7-.3.9 0l.9 1.6c.1.3.1.6-.1.8l-.5.6c.6 1.2 1.6 2.2 2.8 2.8l.6-.5c.2-.2.5-.2.8-.1l1.6.9c.3.2.3.6 0 .9l-.7.7c-.5.5-1.3.6-2 .3-2.3-1-4.1-2.8-5.1-5.1-.3-.7-.2-1.5.3-2z"/></svg>';

  $('itemText').addEventListener('click', function (e) {

    toonSuggesties(it);
  }
  // Categorie corrigeren: tik een icoontje aan of uit. Vanaf dan geldt jouw keuze voor dit item.
  function toonItemCats(it) {
    var el = $('itemCats'); el.innerHTML = '';
    var huidig = catsVan(it), handmatig = Array.isArray(it.cats);
    CATS.forEach(function (c) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'catBtn' + (huidig.indexOf(c.id) > -1 ? ' on' : '');
      b.textContent = c.ico;
      b.setAttribute('aria-label', c.naam);
      b.addEventListener('click', function () {
        var set = catsVan(it).slice(), i = set.indexOf(c.id);
        if (i > -1) set.splice(i, 1); else set.push(c.id);
        it.cats = CATS.map(function (k) { return k.id; }).filter(function (id) { return set.indexOf(id) > -1; });
        touch(it); save(); render(); showItem(it);
      });
      el.appendChild(b);
    });
    if (handmatig) {
      var a = document.createElement('button');
      a.type = 'button'; a.className = 'auto'; a.textContent = 'automatisch';

  // Bewerken: de tekst wordt een invulvak; de rest van de knoppen maakt even plaats

  $('editSave').addEventListener('click', function () {

  /* =====================================================================

  var CFG = {
    clientId: 'fdf237c9-bf46-47fa-ab3d-a8834a73e284',

      lsSet(PKCE_KEY, { v: verifier, s: st });

        response_mode: 'query', scope: CFG.scope + (extraScope ? ' ' + extraScope : ''), state: st,

    a.concat(b).forEach(function (it) {

  /* ---------- brievenbus: deelknop/Siri (OneDrive › Claudemmer › Inbox) en doorgestuurde mail ----------
     - De iPhone-opdracht "In de emmer" bewaart tekst als bestand in Claudemmer/Inbox.
       Bij elke sync wordt elk bestand een item; tekstbestanden gaan daarna weg,
       andere bestanden (foto, PDF) verhuizen naar Claudemmer/Bijlagen en het item linkt ernaartoe.
     - Mail die naar EMMER_ADRES gaat (plus-adres: komt gewoon in je eigen inbox) wordt ook een item;
       de mail verhuist daarna naar de Outlook-map "Emmer".
     Item-id's zijn vast per bestand/mail, dus dubbel verwerken levert nooit dubbele items op. */
  var INBOX = CFG.folder + '/Inbox', BIJLAGEN = 'Bijlagen';
  var EMMER_ADRES = 'info+emmer@visserinspecties.nl', MAILMAP = 'Emmer';
  var TEKST_EXT = /\.(txt|md|text|url|webloc|json)$/i;
  var opruimen = [];                      // na een geslaagde sync: bestanden/mails wegzetten

  function encPad(p) { return p.split('/').map(encodeURIComponent).join('/'); }
  function heeftItem(id) { return items.some(function (i) { return i.id === id; }); }
  function nieuwItem(id, tekst, extra) {
    if (heeftItem(id)) return false;
    var now = Date.now();
    var it = { id: id, text: tekst, w: 3, created: now, updated: now, archived: false };
    Object.keys(extra || {}).forEach(function (k) { if (extra[k]) it[k] = extra[k]; });
    items.push(it); return true;
  }
  function schoonTekst(t, naam) {
    t = String(t || '').replace(/\r/g, '').trim();
    var url = t.match(/^\s*\[InternetShortcut\][\s\S]*?^URL=(.+)$/m);   // .url-bestand
    if (url) t = url[1].trim();
    if (!t) t = naam.replace(TEKST_EXT, '');

  }

  // mailtoken apart ophalen; lukt het niet (geen toestemming), dan slaan we mail gewoon over
  function mailToken() {
    if (!tok || !tok.refresh) return Promise.resolve(null);
    return fetch(AUTHORITY + '/token', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({ grant_type: 'refresh_token', client_id: CFG.clientId, refresh_token: tok.refresh,
        scope: 'https://graph.microsoft.com/Mail.ReadWrite offline_access' }).toString()
    }).then(function (r) { return r.json(); }).then(function (j) {
      if (!j.access_token) return null;
      if (j.refresh_token) { tok.refresh = j.refresh_token; lsSet(TOK_KEY, tok); }
      return j.access_token;
    }, function () { return null; });
  }

  function haalBestanden() {
    return gfetch('/me/drive/root:/' + encPad(INBOX) + ':/children?$top=100').then(function (r) {
      if (r.status === 404) return [];
      if (!r.ok) return [];
      return r.json().then(function (j) { return (j.value || []).filter(function (x) { return x.file; }); });
    }).then(function (lijst) {
      return lijst.reduce(function (p, f) {
        return p.then(function () {
          var id = 'inbox-' + f.id;
          var tekst = TEKST_EXT.test(f.name) || /^text\//.test((f.file || {}).mimeType || '') || !/\.[a-z0-9]{2,5}$/i.test(f.name);
          if (heeftItem(id)) { opruimen.push({ soort: 'bestand', f: f, tekst: tekst }); return; }   // al verwerkt, alleen nog opruimen
          if (!tekst) {
            nieuwItem(id, '📎 ' + f.name, { bron: 'deelknop', link: f.webUrl });
            opruimen.push({ soort: 'bestand', f: f, tekst: false });

          var id = 'mail-' + m.id.slice(-24);
          var onderwerp = (m.subject || '(geen onderwerp)').replace(/^\s*((fw|fwd|doorst|tr|wg)\s*:\s*)+/i, '').trim();
          var notitie = (m.bodyPreview || '').split(/\r?\n/)[0].trim();

  function ruimBrievenbusOp() {

  /* ---------- contactgegevens opzoeken bij een Mensen-item ----------
     Open je een Mensen-item zonder telefoonnummer of mailadres (bv. "REIMER"), dan zoekt de app op
     die naam in je Outlook-contactpersonen, in Outlook's personenlijst (mensen met wie je contact hebt)
     en in je mail (afzender + nummer uit diens handtekening). Je krijgt maximaal drie voorstellen:
     ✓ = gegevens in de tekst zetten (blijven staan), ✗ = dit voorstel niet meer tonen bij dit item.
     Niets wordt zonder jouw ✓ in het item gezet. iPhone-contacten (iCloud) zijn voor een webapp
     niet bereikbaar; alleen wat in Outlook/Exchange staat. */
  var CONTACT_SCOPE = 'https://graph.microsoft.com/Contacts.Read https://graph.microsoft.com/People.Read';
  var MAIL_SCOPE = 'https://graph.microsoft.com/Mail.ReadWrite';
  var EIGEN_DOMEIN = /@visserinspecties\.nl$/i;
  var scopeTok = {}, zoekCache = {};

  function scopedToken(scope) {

    if (!tok || !tok.refresh) return Promise.resolve(null);
    return fetch(AUTHORITY + '/token', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({ grant_type: 'refresh_token', client_id: CFG.clientId, refresh_token: tok.refresh,
        scope: scope + ' offline_access' }).toString()
    }).then(function (r) { return r.json(); }).then(function (j) {
      if (!j.access_token) { scopeTok[scope] = { fout: Date.now() }; return null; }   // nog geen toestemming
      if (j.refresh_token) { tok.refresh = j.refresh_token; lsSet(TOK_KEY, tok); }
      scopeTok[scope] = { t: j.access_token, exp: Date.now() + (j.expires_in || 3600) * 1000 };

  function gget(t, pad, extraHeaders) {

      .then(function (r) { return r.ok ? r.json() : { value: [] }; }, function () { return { value: [] }; });
  }

  var ACTIEWOORD = /^(bel|bellen|terugbellen|gebeld|mail|mailen|mailtje|afspraak|afspreken|whatsapp|appen|appje|spreken|contact|overleg|overleggen|bespreken|vragen|vraag|terugkoppelen|sturen|met|over|en|van|voor|nog|even)$/i;
  function zoekNaam(it) {
    var eerste = String(it.text || '').trim().split('\n')[0].replace(/^✓ /, '').replace(/["<>(),:]/g, ' ');
    var w = eerste.split(/\s+/).filter(function (x) { return x && !ACTIEWOORD.test(x) && /^[A-Za-zÀ-ÿ'\-]{2,}$/.test(x); });
    // "Jacob overleg" -> "Jacob": een naam begint met een hoofdletter; losse gewone woorden horen er niet bij
    var hoofd = w.filter(function (x) { return /^[A-ZÀ-Ý]/.test(x); });
    return (hoofd.length ? hoofd : w.slice(0, 1)).slice(0, 2).join(' ');

    t = String(t || '');

  }

    return !!(tok && !it.archived && catsVan(it).indexOf('mensen') > -1 && !heeftContact(it.text) && zoekNaam(it).length >= 2);

  function past(naam, tekst) {
    var h = norm(tekst);

  }
  function nummersUit(tekst) {
    var uit = [];
    (String(tekst || '').match(RE_TEL) || []).forEach(function (x) {
      var n = telNummer(x); if (n && uit.indexOf(x.trim()) < 0) uit.push(x.trim());
    });

  function zoekInContacten(naam) {
    return scopedToken(CONTACT_SCOPE).then(function (t) {
      if (!t) return { geenToestemming: true, lijst: [] };
      var q = naam.split(' ')[0].replace(/'/g, "''");
      var f = "startswith(givenName,'" + q + "') or startswith(surname,'" + q + "') or startswith(displayName,'" + q + "')";
      var contacten = gget(t, '/me/contacts?$top=15&$select=displayName,emailAddresses,mobilePhone,businessPhones,homePhones,companyName&$filter=' + encodeURIComponent(f));
      var personen = gget(t, '/me/people?$top=10&$select=displayName,scoredEmailAddresses,phones,companyName,personType&$search=' + encodeURIComponent('"' + naam + '"'));
      return Promise.all([contacten, personen]).then(function (r) {
        var lijst = [];
        (r[0].value || []).forEach(function (c) {
          var mail = ((c.emailAddresses || [])[0] || {}).address || '';
          if (!past(naam, (c.displayName || '') + ' ' + mail)) return;
          lijst.push({ naam: c.displayName, bedrijf: c.companyName, email: mail,
            tels: [c.mobilePhone].concat(c.businessPhones || [], c.homePhones || []).filter(Boolean), bron: 'Outlook-contactpersonen' });
        });
        (r[1].value || []).forEach(function (p) {
          if (p.personType && p.personType.class && p.personType.class !== 'Person') return;
          var mail = ((p.scoredEmailAddresses || [])[0] || {}).address || '';
          if (!past(naam, (p.displayName || '') + ' ' + mail)) return;
          lijst.push({ naam: p.displayName, bedrijf: p.companyName, email: mail,
            tels: (p.phones || []).map(function (x) { return x.number; }).filter(Boolean), bron: 'Outlook' });
        });
        return { lijst: lijst };
      });
    });
  }

  function zoekInMail(naam) {
    return scopedToken(MAIL_SCOPE).then(function (t) {
      if (!t) return { lijst: [] };
      return gget(t, '/me/messages?$top=20&$select=from,toRecipients,receivedDateTime,uniqueBody&$search=' + encodeURIComponent('"' + naam + '"'),
        { Prefer: 'outlook.body-content-type="text"' }).then(function (j) {
        var lijst = [];
        (j.value || []).forEach(function (m) {
          var dat = new Date(m.receivedDateTime).toLocaleDateString('nl-NL', { day: 'numeric', month: 'short' });
          var van = (m.from || {}).emailAddress || {};
          if (van.address && !EIGEN_DOMEIN.test(van.address) && past(naam, (van.name || '') + ' ' + van.address)) {
            // nummer uit hun eigen deel van de mail (uniqueBody = zonder de geciteerde eerdere mails, dus niet jouw handtekening)
            lijst.push({ naam: van.name || van.address, email: van.address,
              tels: nummersUit(((m.uniqueBody || {}).content) || ''), bron: 'mail van ' + dat });
          }
          (m.toRecipients || []).forEach(function (x) {
            var a = x.emailAddress || {};
            if (a.address && !EIGEN_DOMEIN.test(a.address) && past(naam, (a.name || '') + ' ' + a.address))
              lijst.push({ naam: a.name || a.address, email: a.address, tels: [], bron: 'jouw mail van ' + dat });
          });
        });
        return { lijst: lijst };
      });
    });
  }

  // Samenvoegen per mailadres (of naam), nummers bij elkaar; met nummer en uit contactpersonen eerst
  function samenvoegen(lijsten) {
    var map = {}, volgorde = [];
    lijsten.forEach(function (k) {
      var sl = (k.email || '').toLowerCase() || norm(k.naam);
      var cur = map[sl];
      if (!cur) { cur = map[sl] = { sleutel: sl, naam: k.naam, bedrijf: k.bedrijf || '', email: k.email || '', tels: [], bronnen: [] }; volgorde.push(sl); }
      if (!cur.bedrijf && k.bedrijf) cur.bedrijf = k.bedrijf;
      if ((k.naam || '').length > (cur.naam || '').length && !/@/.test(k.naam)) cur.naam = k.naam;
      (k.tels || []).forEach(function (x) {
        var n = telNummer(x); if (!n) return;
        if (!cur.tels.some(function (y) { return telNummer(y) === n; })) cur.tels.push(x);
      });
      if (cur.bronnen.indexOf(k.bron) < 0) cur.bronnen.push(k.bron);
    });
    return volgorde.map(function (s) { return map[s]; }).sort(function (a, b) {
      var sa = (a.tels.length ? 2 : 0) + (a.bronnen.join().indexOf('contactpersonen') > -1 ? 1 : 0);
      var sb = (b.tels.length ? 2 : 0) + (b.bronnen.join().indexOf('contactpersonen') > -1 ? 1 : 0);
      return sb - sa;
    });
  }

  function zoekContact(naam) {
    var sl = norm(naam);
    if (!zoekCache[sl]) {
      zoekCache[sl] = Promise.all([zoekInContacten(naam), zoekInMail(naam)]).then(function (r) {
        return { kandidaten: samenvoegen(r[0].lijst.concat(r[1].lijst)), geenToestemming: !!r[0].geenToestemming };
      }, function () { return { kandidaten: [], geenToestemming: false }; });
    }
    return zoekCache[sl];
  }

  function toonSuggesties(it) {
    var el = $('itemSuggest'); el.innerHTML = '';
    if (!moetZoeken(it)) return;
    var naam = zoekNaam(it), id = it.id;
    var kop = document.createElement('p'); kop.className = 'kop';
    kop.textContent = 'Gegevens van ' + naam + ' zoeken in Outlook en je mail…';
    el.appendChild(kop);
    zoekContact(naam).then(function (res) {
      if (currentId !== id || !itemDlg.open) return;
      el.innerHTML = '';
      var afg = it.afgewezen || [];
      var kand = res.kandidaten.filter(function (k) { return afg.indexOf(k.sleutel) < 0; }).slice(0, 3);
      var kp = document.createElement('p'); kp.className = 'kop';
      kp.textContent = kand.length ? 'Gevonden voor "' + naam + '" — klopt dit?' : 'Geen gegevens gevonden voor "' + naam + '".';
      el.appendChild(kp);
      kand.forEach(function (k) {
        var rij = document.createElement('div'); rij.className = 'kand';
        var g = document.createElement('span'); g.className = 'gegevens';
        // nummers onbreekbaar tonen (niet "06-" op de ene en de rest op de volgende regel)
        var telsZicht = k.tels.map(function (x) { return x.replace(/-/g, '\u2011').replace(/ /g, '\u00a0'); }).join(' / ');
        var naamZicht = /@/.test(k.naam || '') ? (k.bedrijf || '') : k.naam + (k.bedrijf ? ' (' + k.bedrijf + ')' : '');
        g.appendChild(document.createTextNode([naamZicht, telsZicht, k.email].filter(Boolean).join(' · ')));
        var b = document.createElement('span'); b.className = 'bron'; b.textContent = 'uit ' + k.bronnen.join(', ');
        g.appendChild(b);
        var ja = document.createElement('button'); ja.className = 'ja'; ja.type = 'button'; ja.textContent = '✓'; ja.setAttribute('aria-label', 'Klopt, in het item zetten');
        ja.addEventListener('click', function () {
          var naamRegel = /@/.test(k.naam || '') ? (k.bedrijf || '') : k.naam + (k.bedrijf ? ' (' + k.bedrijf + ')' : '');
          var regels = [naamRegel, k.tels.join(' / '), k.email].filter(Boolean);
          it.text = String(it.text).replace(/\s+$/, '') + '\n' + regels.join('\n');
          touch(it); save(); render(); showItem(it);
        });
        var nee = document.createElement('button'); nee.className = 'nee'; nee.type = 'button'; nee.textContent = '✗'; nee.setAttribute('aria-label', 'Klopt niet, niet meer tonen');
        nee.addEventListener('click', function () {
          it.afgewezen = afg.concat(k.sleutel);
          touch(it); save(); toonSuggesties(it);
        });
        rij.appendChild(g); rij.appendChild(ja); rij.appendChild(nee);
        el.appendChild(rij);
      });
      if (res.geenToestemming) {
        var l = document.createElement('button'); l.className = 'link'; l.type = 'button';
        l.textContent = 'Ook je Outlook-contactpersonen doorzoeken (één keer toestemming geven)';
        l.addEventListener('click', function () { login(CONTACT_SCOPE + ' ' + MAIL_SCOPE); });
        el.appendChild(l);
      }
    });
  }

  /* ---------- de sync zelf ---------- */
  var syncing = false, again = false, syncTimer = null;

  function attempt(n) {
    return getRemote().then(function (remote) {
      var remoteItems = remote ? remote.items : [];
      items = mergeLists(items, remoteItems);   // lokaal en OneDrive samen
      persist(); render();
      if (remote && stable(items) === stable(remoteItems.map(function (it) { if (!it.updated) it.updated = stamp(it); return it; }))) return;
      return putRemote(items, remote && remote.etag).then(null, function (e) {
        if (e.conflict && n < 3) return attempt(n + 1);   // ander toestel was ons voor: opnieuw ophalen en samenvoegen
        throw e;
      });
    });
  }

  function sync() {
    if (!tok) { setStatus('off'); return Promise.resolve(); }
    if (!navigator.onLine) { setStatus('offline'); return Promise.resolve(); }
    if (syncing) { again = true; return Promise.resolve(); }
    syncing = true; setStatus('busy');
    return brievenbus().then(function () { return attempt(0); }).then(function () {
      lastOk = Date.now(); lastError = ''; setStatus('ok');
      return ruimBrievenbusOp();
    }, function (e) {
      if (e.auth) { setStatus('off'); lastError = e.message; }
      else if (e instanceof TypeError || !navigator.onLine) { setStatus('offline'); }
      else { lastError = e.message; setStatus('err'); }
    }).then(function () {
      syncing = false;
      if (again) { again = false; scheduleSync(); }
    });
  }

  function scheduleSync() {
    if (!tok) return;
    clearTimeout(syncTimer);
    syncTimer = setTimeout(sync, 1200);   // even wachten, zodat meerdere wijzigingen in één keer gaan
  }

  /* ---------- statusknopje en venster ---------- */
  var syncBtn = $('syncBtn'), syncDlg = $('syncDlg');
  function hhmm(t) { return new Date(t).toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' }); }
  function setStatus(s) {
    state = s;
    var labels = {
      off: 'inloggen', idle: '', busy: 'sync…', offline: 'offline', err: 'sync-fout',
      ok: lastOk ? 'gesynct ' + hhmm(lastOk) : 'gesynct'
    };
    syncBtn.textContent = labels[s];
    syncBtn.className = (s === 'err' || (s === 'off' && lastError)) ? 'err' : '';
  }

  syncBtn.addEventListener('click', function () {
    if (!tok) { login(); return; }
    var info = {
      idle: 'Bezig met verbinden…', busy: 'Bezig met synchroniseren…', offline: 'Geen verbinding. Wijzigingen blijven lokaal bewaard en gaan mee zodra je weer online bent.',
      err: 'Synchroniseren is mislukt.', ok: 'Gesynct met OneDrive\\Claudemmer\\verzamelbak.json' + (lastOk ? ' om ' + hhmm(lastOk) : '') + '.',
      off: 'Niet ingelogd.'
    };
    $('syncInfo').textContent = info[state] || '';
    $('syncErr').textContent = lastError;
    syncDlg.showModal();
  });
  $('syncNow').addEventListener('click', function () { syncDlg.close(); sync(); });
  $('syncOut').addEventListener('click', function () {
    tok = null; lsSet(TOK_KEY, null); lastOk = null; lastError = '';
    setStatus('off'); syncDlg.close();
  });
  $('syncClose').addEventListener('click', function () { syncDlg.close(); });
  syncDlg.addEventListener('click', function (e) { if (e.target === syncDlg) syncDlg.close(); });

  // Wanneer synchroniseren: bij openen, bij terugkeer naar de app, bij weer online, en elke minuut
  // (render erbij: als de app over middernacht open blijft, gaat een deadline van vandaag dan ook knipperen)
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { verborgenSinds = Date.now(); return; }
    // Langer dan 20 minuten weg: categoriefilter uit, zodat je nooit denkt dat er iets kwijt is
    if (filterCat && verborgenSinds && Date.now() - verborgenSinds > 20 * 60000) filterCat = null;
    render(); sync();
  });
  window.addEventListener('online', sync);
  setInterval(function () { if (!document.hidden) sync(); }, 60000);

  render();
  setStatus(tok ? 'idle' : 'off');
  handleRedirect().then(function () {
    setStatus(tok ? 'idle' : 'off');
    if (lastError) { syncBtn.className = 'err'; }
    return sync();
  });

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
})();
</script>
</body>
